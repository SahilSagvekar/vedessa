name: CI

# Runs on every pull request. Merging is safe when this is green; the Deploy
# workflow then ships whatever lands on main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Syntax check every backend .js file
        working-directory: backend
        run: find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
        run: npx prisma validate
      - name: Schema changes must ship with a migration
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qx 'backend/prisma/schema.prisma'; then
            if ! git diff --name-only --diff-filter=A "$BASE_SHA"...HEAD | grep -q '^backend/prisma/migrations/'; then
              echo "::error file=backend/prisma/schema.prisma::schema.prisma changed but no new folder was added under backend/prisma/migrations. Production applies migrations with 'prisma migrate deploy' (not 'db push'), so create one with 'npx prisma migrate dev --name <change>'."
              exit 1
            fi
          fi

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck deploy/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PM2 config loads
        run: node -e "const c=require('./deploy/ecosystem.config.js'); if(!c.apps||!c.apps[0].name) process.exit(1); console.log('ok:', c.apps[0].name)"
